[package]
name = "onepassword-cli"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The access module is private to bitwarden-importers; `test-utils` re-exports it for this CLI.
bitwarden-importers = { path = "../sdk-internal/crates/bitwarden-importers", features = [
    "test-utils",
] }

anyhow = ">=1.0, <2.0"
async-trait = ">=0.1.80, <0.2"
clap = { version = "4.5.4", features = ["derive"] }
data-encoding = ">=2.0, <3"
hmac = "0.13.0"
reqwest = { version = "0.13.3", default-features = false, features = [
    "json",
    "http2",
    "rustls",
] }
serde = { version = ">=1.0, <2.0", features = ["derive"] }
sha1 = "0.11.0"
tokio = { version = "1.36.0", features = ["macros", "rt"] }
toml = "0.9"
serde_json = "1.0.151"
